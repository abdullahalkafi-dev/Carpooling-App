services:
  redis-carpooling:
    image: redis:7
    container_name: redis-carpooling
    ports:
      - "6381:6379"
  carpooling-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carpooling-backend
    ports:
      - "5007:5007"
    env_file:
      - .env
    volumes:
      - .:/app
      - carpooling-logs:/app/winston
      - /app/node_modules
    depends_on:
      - redis-carpooling
    command: pnpm run dev
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
volumes:
  carpooling-logs:
