services:
  redis-carpooling:
      image: redis:7
      container_name: redis-carpooling
      ports:
        - "6381:6379"
  carpooling-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carpooling-backend
    ports:
      - "5007:5004"
    env_file:
      - .env
    volumes:
      - .:/app
      - carpooling-logs:/app/winston
      - /app/node_modules
    depends_on:
      - redis-carpooling
    command: pnpm run dev
    
  

volumes:
  carpooling-logs:
    